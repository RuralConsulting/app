<head>

<title>Farm platform | Rural Consulting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="brand/icon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCL Farms">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css?v=202610270338-f85c54e">
</head>
<body>
<p id="loading" class="loading">Loading…</p>

<main id="screen-signin" class="screen" hidden>
  <div class="card">
    <div class="org"><span class="brand"><img class="logo logo-light" src="brand/logo.png" alt="Rural Consulting"><img class="logo logo-dark" src="brand/logo-dark.png" alt="Rural Consulting"></span></div>
    <h1>Farm platform</h1>
    <form id="f-signin" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="signin-msg" class="msg" role="alert"></p>
    <p class="fine">Accounts are set up by Rural Consulting. Forgotten your password? Ask RCL to set you a new one.</p>
  </div>
</main>

<main id="screen-password" class="screen" hidden>
  <div class="card">
    <div class="org"><span class="brand"><img class="logo logo-light" src="brand/logo.png" alt="Rural Consulting"><img class="logo logo-dark" src="brand/logo-dark.png" alt="Rural Consulting"></span></div>
    <h1>Change password</h1>
    <form id="f-password" novalidate>
      <input type="email" id="pw-email" autocomplete="username" hidden>
      <label for="pw0">Current password</label>
      <input id="pw0" type="password" autocomplete="current-password" required>
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="10" required>
      <label for="pw2">Type it again</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="10" required>
      <p class="help">At least 10 characters. A few words strung together are easy to remember and hard to guess.</p>
      <button type="submit">Save new password</button>
      <button type="button" id="b-pw-back" class="link">Back to the map</button>
    </form>
    <p id="pw-msg" class="msg" role="alert"></p>
  </div>
</main>

<main id="screen-farms" class="screen" hidden>
  <div class="card wide">
    <div class="org"><span class="brand"><img class="logo logo-light" src="brand/logo.png" alt="Rural Consulting"><img class="logo logo-dark" src="brand/logo-dark.png" alt="Rural Consulting"></span></div>
    <h1>Farms</h1>
    <ul id="farm-list" class="farm-list"></ul>
    <p id="farms-msg" class="msg"></p>
    <p class="fine"><span class="who"></span> · <button type="button" class="link b-password">Change password</button> · <button type="button" class="link b-signout">Sign out</button></p>
  </div>
</main>

<div id="screen-map" class="map-screen" hidden>
  <div id="map"></div>
  <aside id="panel" class="panel">
    <button type="button" id="b-panel" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span id="farm-name">Farm</span><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div id="panel-body" class="panel-body">
      <p id="farm-sub" class="sub"></p>
      <div class="basemaps" role="group" aria-label="Background">
        <button type="button" data-basemap="aerial" aria-pressed="true">Aerial</button>
        <button type="button" data-basemap="topo" aria-pressed="false">Map</button>
      </div>
      <ul id="layer-list" class="layer-list"></ul>
      <p class="fine panel-foot">
        <button type="button" class="link" id="b-farms" hidden>All farms</button>
        <span class="who"></span><br>
        <button type="button" class="link b-password">Change password</button> · <button type="button" class="link b-signout">Sign out</button>
      </p>
    </div>
  </aside>
  <p id="map-msg" class="map-msg" role="status" hidden></p>
</div>

<script src="vendor/supabase.js"></script>
<script src="vendor/maplibre-gl-csp.js"></script>
<script src="js/config.js?v=202610270338-f85c54e"></script>
<script src="js/util.js?v=202610270338-f85c54e"></script>
<script src="js/qml.js?v=202610270338-f85c54e"></script>
<script src="js/basemaps.js?v=202610270338-f85c54e"></script>
<script src="js/auth.js?v=202610270338-f85c54e"></script>
<script src="js/popup.js?v=202610270338-f85c54e"></script>
<script src="js/farm-map.js?v=202610270338-f85c54e"></script>
<script src="js/main.js?v=202610270338-f85c54e"></script>
</body>
</html>
